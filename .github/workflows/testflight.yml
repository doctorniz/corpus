name: TestFlight

# Builds a signed iOS app and uploads it to TestFlight.
# Run it by hand (Actions > TestFlight > Run workflow) or by pushing a tag
# like v0.1.0. Needs the secrets described in docs/IOS_RELEASE.md.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.corpus.corpus' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are set
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing=0
          for name in TEAM_ID PROFILE_NAME CERT PROFILE KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name (see docs/IOS_RELEASE.md)"; missing=1; fi
          done
          exit $missing

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Install signing certificate and profile
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo -n "$CERT_P12" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROFILE" | base64 --decode -o "$HOME/Library/MobileDevice/Provisioning Profiles/corpus.mobileprovision"

      - name: Point the Xcode project at the signing identity
        run: |
          # The entitlements line exists only in the app target's build
          # settings, so it is a safe place to add manual signing.
          sed -i '' "s|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;|CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\"; PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";|" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = app.corpus.corpus;|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;|" ios/Runner.xcodeproj/project.pbxproj

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build signed app
        run: >
          flutter build ipa --release
          --build-number=${{ github.run_number }}
          --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$API_KEY" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app --type ios \
            -f build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/corpus.mobileprovision"
          rm -rf "$HOME/.appstoreconnect"
